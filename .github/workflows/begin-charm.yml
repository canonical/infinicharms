name: Begin charm

# Triggers when an issue is opened. Uses an agent to evaluate the issue
# and posts the agent's assessment ("Sounds tough!" or "Sounds easy!")
# back as a comment.
on:
  issues:
    types:
      - opened

concurrency:
  group: begin-charm-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  evaluate:
    # Bug reports (see .github/ISSUE_TEMPLATE/bug_report.yml) are handled by
    # the bug-report workflow instead.
    if: "!contains(github.event.issue.labels.*.name, 'bug')"
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: '1.18.16'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install OpenCode
        run: npm install -g "opencode-ai@${OPENCODE_VERSION}"  # zizmor: ignore[adhoc-packages] pinned version, no lockfile available for global npm installs

      - name: Evaluate issue
        id: evaluate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_ROOT: ${{ github.workspace }}
        run: .github/scripts/evaluate-issue.sh

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ steps.evaluate.outputs.response }}
        run: .github/scripts/comment-on-issue.sh
